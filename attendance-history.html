<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوابق حضور و غیاب</title>
</head>

<body>

    <h1>📋 سوابق حضور و غیاب</h1>

    <div id="attendanceContainer">
        در حال دریافت اطلاعات...
    </div>
<script>
async function loadAttendance() {
    
    try {
        const response = await fetch("https://schoolshariati-backend.onrender.com/api/register");
        const data = await response.json();

        console.log(data);

        document.getElementById("attendanceContainer").innerHTML =
            JSON.stringify(data, null, 2);

    } catch (error) {
        console.error(error);

        document.getElementById("attendanceContainer").innerText =
            "خطا در دریافت اطلاعات حضور و غیاب";
    }
}

loadAttendance();
</script>
</body>
</html>
