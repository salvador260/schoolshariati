<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | مدرسه شریعتی</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 10% 10%,rgba(37,99,235,.18),transparent 28%),
    radial-gradient(circle at 90% 90%,rgba(79,70,229,.14),transparent 30%),
    linear-gradient(135deg,#eef4ff,#f8faff);
    color:#172033;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(20px);
    box-shadow:0 10px 35px rgba(20,40,80,.08);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    color:#173b7a;
    font-size:20px;
    font-weight:bold;
}

.logo-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    color:white;
    font-size:24px;
    background:linear-gradient(135deg,#2563eb,#173b7a);
}

.admin-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.admin-avatar{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#2563eb;
    color:white;
}

.admin-info small{
    display:block;
    color:#667085;
    margin-top:4px;
}

.layout{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:30px 20px;
    display:grid;
    grid-template-columns:240px 1fr;
    gap:25px;
}

.sidebar{
    height:max-content;
    position:sticky;
    top:95px;
    padding:18px;
    border-radius:25px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(20px);
    box-shadow:0 20px 55px rgba(20,40,80,.1);
}

.sidebar-title{
    color:#667085;
    font-size:11px;
    padding:10px;
    margin-bottom:8px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.menu button{
    width:100%;
    border:none;
    padding:13px;
    border-radius:13px;
    background:transparent;
    color:#475467;
    cursor:pointer;
    text-align:right;
    font-size:12px;
    transition:.3s;
}

.menu button:hover,
.menu button.active{
    color:white;
    background:linear-gradient(135deg,#2563eb,#173b7a);
}

.content{
    min-width:0;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:27px;
    margin-bottom:8px;
}

.page-title p{
    color:#667085;
    font-size:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    padding:20px;
    border-radius:22px;
    background:rgba(255,255,255,.85);
    box-shadow:0 15px 40px rgba(20,40,80,.08);
}

.stat-icon{
    font-size:25px;
    margin-bottom:12px;
}

.stat-number{
    font-size:27px;
    font-weight:bold;
    color:#2563eb;
}

.stat-label{
    color:#667085;
    font-size:11px;
    margin-top:5px;
}

.panel{
    padding:22px;
    border-radius:24px;
    background:rgba(255,255,255,.85);
    box-shadow:0 18px 50px rgba(20,40,80,.09);
    margin-bottom:20px;
}

.panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.panel-header h2{
    font-size:17px;
}

.search-area{
    display:flex;
    gap:10px;
}

.search-area input{
    flex:1;
    min-width:0;
    padding:14px;
    border:1px solid #d9e0eb;
    border-radius:12px;
    outline:none;
    font-size:13px;
}

.search-area button{
    border:none;
    padding:0 22px;
    border-radius:12px;
    color:white;
    background:#2563eb;
    cursor:pointer;
}

#searchResult{
    margin-top:18px;
}

.search-result-card{
    padding:18px;
    border-radius:18px;
    border:1px solid #dbeafe;
    background:#f5f9ff;
}

.search-result-card h3{
    margin-bottom:10px;
}

.search-result-card p{
    color:#667085;
    font-size:12px;
    margin-top:6px;
}

.result-type{
    color:#2563eb !important;
    font-weight:bold;
}

.result-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.management-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.management-buttons button{
    border:none;
    padding:20px 10px;
    border-radius:17px;
    background:#f3f6ff;
    color:#344054;
    cursor:pointer;
    transition:.3s;
}

.management-buttons button:hover{
    transform:translateY(-4px);
    background:#e8efff;
}

.management-buttons strong{
    display:block;
    margin-top:8px;
    font-size:12px;
}

.attendance-tools{
    display:grid;
    grid-template-columns:1.2fr 1fr 180px auto;
    gap:10px;
    margin-bottom:16px;
    padding:14px;
    border-radius:16px;
    background:#f5f8ff;
    border:1px solid #e1e9ff;
}

.attendance-tools input,
.attendance-tools select{
    width:100%;
    padding:11px 12px;
    border:1px solid #d9e0eb;
    border-radius:10px;
    outline:none;
    background:#fff;
    font-size:12px;
}

.attendance-tools button{
    white-space:nowrap;
}

.attendance-present{color:#067647;font-weight:bold;}
.attendance-absent{color:#b42318;font-weight:bold;}
.attendance-late{color:#b54708;font-weight:bold;}

@media(max-width:850px){
    .attendance-tools{grid-template-columns:1fr 1fr;}
}

@media(max-width:550px){
    .attendance-tools{grid-template-columns:1fr;}
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th,
td{
    padding:13px;
    border-bottom:1px solid #edf0f5;
    text-align:center;
    font-size:11px;
}

th{
    color:#667085;
}

.edit-btn,
.delete-btn{
    border:none;
    padding:7px 11px;
    border-radius:8px;
    cursor:pointer;
    margin:2px;
}

.edit-btn{
    color:#175cd3;
    background:#eef4ff;
}

.delete-btn{
    color:#b42318;
    background:#fff0f0;
}

.empty{
    text-align:center;
    padding:30px;
    color:#667085;
}

.modal{
    position:fixed;
    inset:0;
    z-index:999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);
}

.modal-box{
    width:100%;
    max-width:500px;
    padding:25px;
    border-radius:25px;
    background:white;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.modal-box h2{
    margin-bottom:20px;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    font-size:11px;
    color:#667085;
    margin-bottom:6px;
}

.input-group input,
.input-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #d9e0eb;
    border-radius:11px;
    outline:none;
    font-size:13px;
}

.input-group textarea{
    min-height:90px;
    resize:vertical;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
    border:none;
    padding:12px;
    border-radius:11px;
    cursor:pointer;
}

.save-btn{
    color:white;
    background:#2563eb;
}

.cancel-btn{
    background:#edf0f5;
}

footer{
    text-align:center;
    padding:25px;
    color:#667085;
    font-size:11px;
}

@media(max-width:950px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:static;
    }

    .menu{
        display:grid;
        grid-template-columns:repeat(3,1fr);
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    header{
        flex-direction:column;
        gap:12px;
    }

    .layout{
        padding:20px 10px;
    }

    .menu{
        grid-template-columns:1fr 1fr;
    }

    .management-buttons{
        grid-template-columns:1fr 1fr;
    }

    .search-area{
        flex-direction:column;
    }

    .search-area button{
        padding:12px;
    }
}
</style>
<link rel="stylesheet" href="theme-enhance.css">
</head>

<body>

<header>

    <div class="logo">
        <div class="logo-icon">🏫</div>
        مدرسه شریعتی
    </div>

    <div class="admin-info">

        <div class="admin-avatar">
            👨‍💼
        </div>

        <div>
            <strong>مدیر مدرسه</strong>
            <small>پنل مدیریت</small>
        </div>

    </div>

</header>


<div class="layout">

<aside class="sidebar">

    <div class="sidebar-title">

    </div>

        onclick="openSection('dashboard',this)">

        </button>

        <button
        onclick="openSection('teachers',this)">
            👨‍🏫 معلمان
        </button>

        <button
        onclick="openSection('classes',this)">
            🏫 کلاس‌ها
        </button>

        <button

        </button>

        <button

<main class="content">

<div class="page-title">

</div>


<div class="stats">

    <div class="stat">

        <div
        class="stat-number"

        </div>

        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">🏫</div>

        class="stat-number"
        id="classCount">
            0
        </div>

        <div class="stat-label">

        </div>

    </div>

<!-- جستجوی کد ملی -->

<!-- پنجره افزودن/ویرایش -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            افزودن اطلاعات
        </h2>

        <div id="formBox"></div>

        <div class="modal-buttons">

            <button
            class="save-btn"
            onclick="saveData()">
                💾 ذخیره اطلاعات
            </button>

            onclick="closeModal()">
                انصراف
            </button>

<script>

/* =========================
   اطلاعات مدرسه
========================= */

const API_BASE = "https://schoolshariati-backend.onrender.com/api";

let data =
JSON.parse(localStorage.getItem("schoolData"))
|| {
    students:[],
    teachers:[],
    classes:[],
    attendance:[],
    grades:[]
};

if(!Array.isArray(data.attendance)){
    data.attendance = [];
}

if(!Array.isArray(data.grades)){
    data.grades = [];
}


let currentType = "";
let currentSection = "dashboard";
let editIndex = -1;


/* =========================
   حضور و غیاب مدیر
========================= */

async function loadAttendance(){

    try{

        const response = await fetch(`${API_BASE}/attendance`, {
            cache:"no-store"
        });

        const raw = await response.text();
        let result;

        try {
            result = JSON.parse(raw);
        } catch(parseError) {
            throw new Error(`سرور برای /api/attendance پاسخ JSON نداد. HTTP ${response.status}: ${raw.slice(0, 120)}`);
        }

        if(!response.ok || !result.success){
            throw new Error(result.message || `دریافت حضور و غیاب ناموفق بود. HTTP ${response.status}`);
        }

        data.attendance = Array.isArray(result.attendance)
            ? result.attendance
            : [];

        renderTable();

    }catch(error){

        console.error("ADMIN ATTENDANCE ERROR:", error);

        data.attendance = [];
        renderTable(error.message || "خطا در دریافت حضور و غیاب");

    }
}

function attendanceStatusText(status){
    if(status === "present") return "حاضر";
    if(status === "absent") return "غایب";
    if(status === "late") return "تأخیر";
    return status || "نامشخص";
}

/* =========================
   نمرات (پنل مدیر)
========================= */

async function loadGrades(){

    try{

        const response = await fetch(`${API_BASE}/teacher/grades`, {
            cache:"no-store"
        });

        const raw = await response.text();
        let result;

        try {
            result = JSON.parse(raw);
        } catch(parseError) {
            throw new Error(`سرور برای /api/teacher/grades پاسخ JSON نداد. HTTP ${response.status}: ${raw.slice(0, 120)}`);
        }

        if(!response.ok || !result.success){
            throw new Error(result.message || `دریافت نمرات ناموفق بود. HTTP ${response.status}`);
        }

        data.grades = Array.isArray(result.grades)
            ? result.grades
            : [];

        renderTable();

    }catch(error){

        console.error("ADMIN GRADES ERROR:", error);

        data.grades = [];
        renderTable(error.message || "خطا در دریافت نمرات");

    }
}

function attendanceStatusClass(status){
    if(status === "present") return "attendance-present";
    if(status === "absent") return "attendance-absent";
    if(status === "late") return "attendance-late";
    return "";
}

function filterAttendance(){
    if(currentSection !== "attendance"){
        return;
    }
    renderTable();
}

function getFilteredAttendance(){
    const nationalCode = (document.getElementById("attendanceNationalCodeFilter")?.value || "").trim();
    const className = (document.getElementById("attendanceClassFilter")?.value || "").trim().toLowerCase();
    const status = document.getElementById("attendanceStatusFilter")?.value || "";

    return data.attendance.filter(item=>{
        const itemNationalCode = String(item.nationalCode || "");
        const itemClass = String(item.className || "").toLowerCase();
        const itemStatus = String(item.status || "");

        return (!nationalCode || itemNationalCode.includes(nationalCode))
            && (!className || itemClass.includes(className))
            && (!status || itemStatus === status);
    });
}

function filterGrades(){
    if(currentSection !== "grades"){
        return;
    }
    renderTable();
}

function getFilteredGrades(){
    const nationalCode = (document.getElementById("gradesNationalCodeFilter")?.value || "").trim();

    return data.grades.filter(item=>{
        const itemNationalCode = String(item.nationalCode || "");

        return (!nationalCode || itemNationalCode.includes(nationalCode));
    });
}

/* =========================
   ذخیره اطلاعات
========================= */

function saveStorage(){

    localStorage.setItem(
        "schoolData",
        JSON.stringify(data)
    );

}


/* =========================
   آمار
========================= */

function updateStats(){

    document.getElementById("studentCount").textContent =
        data.students.length;

    document.getElementById("teacherCount").textContent =
        data.teachers.length;

    document.getElementById("classCount").textContent =
        data.classes.length;

}


/* =========================
   بخش‌ها
========================= */

function openSection(section,button){

    currentSection = section;

    document
    .querySelectorAll(".menu button")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }


    const titles = {

        dashboard:[
            "داشبورد مدیریت",
            "مدیریت کامل اطلاعات مدرسه"
        ],

        students:[
            "مدیریت دانش‌آموزان",
            "افزودن، ویرایش و حذف دانش‌آموزان"
        ],

        teachers:[
            "مدیریت معلمان",
            "مدیریت اطلاعات معلمان"
        ],

        classes:[
            "مدیریت کلاس‌ها",
            "مدیریت کلاس‌های مدرسه"
        ],

        attendance:[
            "حضور و غیاب",
            "این بخش در مرحله بعد کامل می‌شود"
        ],

        grades:[
            "مدیریت نمرات",
            "نمراتی که معلمان برای دانش‌آموزان ثبت کرده‌اند"
        ]

    };


    document.getElementById("pageTitle").textContent =
        titles[section][0];

    document.getElementById("pageDescription").textContent =
        titles[section][1];


    if(section === "attendance"){
        loadAttendance();
    }else if(section === "grades"){
        loadGrades();
    }else{
        renderTable();
    }

}


/* =========================
   مودال
========================= */

function openModal(type,index=-1){

    currentType = type;
    editIndex = index;

    const modal =
        document.getElementById("modal");

    const form =
        document.getElementById("formBox");


    let item = {};

    if(index >= 0){

        item =
        data[type + "s"][index]
        || {};

    }


    const forms = {


        student:`

        <div class="input-group">

            <label>
                نام دانش‌آموز
            </label>

            <input
            id="name"
            value="${escapeHTML(item.name || "")}"
            placeholder="مثلاً علی احمدی">

        </div>


        <div class="input-group">

            <label>
                کد ملی
            </label>

            <input
            id="nationalId"
            type="text"
            inputmode="numeric"
            maxlength="10"
            value="${escapeHTML(item.nationalId || "")}"
            placeholder="۱۰ رقم کد ملی">

        </div>


        <div class="input-group">

            <label>
                پایه
            </label>

            <input
            id="grade"
            value="${escapeHTML(item.grade || "")}"
            placeholder="مثلاً دهم">

        </div>

/* =========================
   بستن
========================= */

function closeModal(){

    document.getElementById("modal").style.display =
        "none";

}


/* =========================
   ذخیره
========================= */

function saveData(){

    let item = {};


    /* دانش‌آموز */

    if(currentType === "student"){

        const name =
            document.getElementById("name").value.trim();

        const nationalId =
            document.getElementById("nationalId").value.trim();

        const grade =
            document.getElementById("grade").value.trim();

        const className =
            document.getElementById("className").value.trim();


        if(!name){

            alert("نام دانش‌آموز را وارد کنید.");

            return;

        }


        if(!/^\d{10}$/.test(nationalId)){

            alert("کد ملی باید دقیقاً ۱۰ رقم باشد.");

            return;

        }


        item = {

            name:name,

            nationalId:nationalId,

            grade:grade,

            className:className

        };

    }


    /* معلم */

    if(currentType === "teacher"){

        const name =
            document.getElementById("name").value.trim();

        const nationalId =
            document.getElementById("nationalId").value.trim();

        const subject =
            document.getElementById("subject").value.trim();

        const phone =
            document.getElementById("phone").value.trim();


        if(!name){

            alert("نام معلم را وارد کنید.");

            return;

        }


        if(!/^\d{10}$/.test(nationalId)){

            alert("کد ملی باید دقیقاً ۱۰ رقم باشد.");

            return;

        }


        item = {

            name:name,

            nationalId:nationalId,

            subject:subject,

            phone:phone

        };

    }


    /* کلاس */

    if(currentType === "class"){

        item = {

            name:
            document.getElementById("name").value.trim(),

            grade:
            document.getElementById("grade").value.trim()

        };

        if(!item.name){

            alert("نام کلاس را وارد کنید.");

            return;

        }

    }


    const key =
        currentType + "s";


    /*
       جلوگیری از ثبت کد ملی تکراری
    */

    if(
        (currentType === "student" ||
         currentType === "teacher")
        &&
        data[key].some(
            (person,index)=>
                person.nationalId === item.nationalId
                &&
                index !== editIndex
        )
    ){

        alert(
            "این کد ملی قبلاً ثبت شده است."
        );

        return;

    }


    if(editIndex >= 0){

        data[key][editIndex] =
            item;

    }else{

        data[key].push(item);

    }


    saveStorage();

    closeModal();

    updateStats();

    renderTable();

    searchNationalId();

    alert(
        "اطلاعات با موفقیت ذخیره شد ✅"
    );

}

function searchNationalId(){

    const input =
        document.getElementById(
            "nationalIdSearch"
        );

    const result =
        document.getElementById(
            "searchResult"
        );


    const nationalId =
        input.value.trim();


    if(!nationalId){

        result.innerHTML = "";

        return;

    }


    if(!/^\d+$/.test(nationalId)){

        result.innerHTML = `

            <div class="search-result-card">

                ❌
                کد ملی فقط باید شامل عدد باشد.

            </div>

        `;

        return;

    }


    const studentIndex =
        data.students.findIndex(
            item =>
            item.nationalId === nationalId
        );


    if(studentIndex !== -1){

        const student =
            data.students[studentIndex];


        result.innerHTML = `

        <div class="search-result-card">

            <p class="result-type">
                👨‍🎓 دانش‌آموز پیدا شد
            </p>

            <h3>
                ${escapeHTML(student.name)}
            </h3>

            <p>
                🔢 کد ملی:
                ${escapeHTML(student.nationalId)}
            </p>

            <p>
                🎓 پایه:
                ${escapeHTML(student.grade || "-")}
            </p>

            <p>
                🏫 کلاس:
                ${escapeHTML(student.className || "-")}
            </p>


            <div class="result-actions">

                <button
                class="edit-btn"
                onclick="openModal('student',${studentIndex})">

                    ✏️ ویرایش

                </button>


                <button
                class="delete-btn"
                onclick="
                deleteItem('students',${studentIndex});
                document.getElementById('nationalIdSearch').value='';
                searchNationalId();
                ">

                    🗑️ حذف

                </button>

            </div>

        </div>

        `;

        return;

    }


    const teacherIndex =
        data.teachers.findIndex(
            item =>
            item.nationalId === nationalId
        );


    if(teacherIndex !== -1){

        const teacher =
            data.teachers[teacherIndex];


        result.innerHTML = `

        <div class="search-result-card">

            <p class="result-type">
                👨‍🏫 معلم پیدا شد
            </p>

            <h3>
                ${escapeHTML(teacher.name)}

            <p>
                🔢 کد ملی:
                ${escapeHTML(teacher.nationalId)}
            </p>

            <p>
                📚 درس:
                ${escapeHTML(teacher.subject || "-")}
            </p>

            <p>
                📞 تلفن:
                ${escapeHTML(teacher.phone || "-")}
            </p>


            <div class="result-actions">

                <button
                class="edit-btn"
                onclick="openModal('teacher',${teacherIndex})">

                    ✏️ ویرایش

                </button>


                <button
                class="delete-btn"
                onclick="
                deleteItem('teachers',${teacherIndex});
                document.getElementById('nationalIdSearch').value='';
                searchNationalId();
                ">

                    🗑️ حذف

                </button>

            </div>

        </div>

        `;

        return;

    }


    result.innerHTML = `

    <div class="search-result-card">

        ❌
        هیچ دانش‌آموز یا معلمی با این کد ملی پیدا نشد.

    </div>

    `;

}

/* =========================
   جلوگیری از HTML
========================= */

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
